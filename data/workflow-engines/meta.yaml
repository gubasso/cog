# Provider metadata for the workflow engine registry.
# Ordering inside a provider's effort ladder is meaningful; ordering across
# providers is undefined (docs/reference/workflow-contract.md).
workflow-engine-providers:
  claude:
    runner: "claude-runner"
    runner_status: "planned"
    efforts: ["none", "low", "medium", "high", "xhigh", "max"]
  codex:
    runner: "codex-runner"
    runner_status: "available"
    efforts: ["minimal", "low", "medium", "high", "xhigh"]
