repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # --- JSON / JSONC: comment-tolerant syntax gate ---
  # Shipped template payloads (authoritative, formatted by their own configs) and
  # vendored bats libs are excluded here and in dprint.json.
  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '^(skill-refs/templates/|test/test_helper/)|[-.]lock\.json$|(^|/)package-lock\.json$'

  # --- EditorConfig ---
  # Enforces the shared .editorconfig baseline (2-space for shell + data
  # formats). Markdown is excluded: editorconfig-checker flags fenced-code-block
  # interiors and defaults to indent_size=4 even when unset, and .editorconfig
  # keeps trim_trailing_whitespace=false for *.md.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        exclude: '\.md$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
        files: ^(bin/.*|lib/.*\.sh|install\.sh|uninstall\.sh|test/.*\.bash|test/.*\.bats)$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-w", "-i", "2", "-ci", "-bn", "-s"]
        files: ^(bin/.*|lib/.*\.sh|install\.sh|uninstall\.sh|test/.*\.bash|test/.*\.bats)$

  - repo: local
    hooks:
      # JSON/JSONC formatter: dprint (comment-safe autofix). Config + pinned
      # plugin in ./dprint.json; template payloads and vendored libs excluded
      # there. External dependency: dprint on PATH (provided by the nix devShell).
      - id: dprint
        name: dprint fmt (json/jsonc)
        entry: dprint fmt
        language: system
        files: '\.(json|jsonc|json5)$'
        exclude: '^(skill-refs/templates/|test/test_helper/)|[-.]lock\.json$|(^|/)package-lock\.json$'
        pass_filenames: true
        stages: [pre-commit]

      - id: test-unit
        name: unit tests
        entry: bash -c 'if compgen -G "test/unit/*.bats" > /dev/null; then bats test/unit; else printf "%s\n" "no unit tests yet"; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-codex-wrapper
        name: codex single-entrypoint invariant
        entry: bin/cog lint-codex-wrapper
        language: system
        files: ^skills/claude/.*/SKILL\.md$
        pass_filenames: true
        stages: [pre-commit]

      - id: skill-lint
        name: skill boundary lint
        entry: bin/cog skill-lint
        language: system
        files: ^(skills/(claude|codex)/.*/SKILL\.md|\.claude/skills/.*/SKILL\.md)$
        pass_filenames: true
        stages: [pre-commit]

      - id: skill-refs-lint
        name: skill-refs self-containment lint
        entry: bin/cog skill-lint
        language: system
        files: ^skill-refs/.*\.md$
        exclude: ^skill-refs/templates/
        pass_filenames: true
        stages: [pre-commit]

      - id: test-integration
        name: integration tests
        entry: bash -c 'if compgen -G "test/integration/*.bats" > /dev/null; then bats test/integration; else printf "%s\n" "no integration tests yet"; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: test-live
        name: live tests
        entry: bash -c 'if compgen -G "test/live/*.bats" > /dev/null; then bats test/live; else printf "%s\n" "no live tests yet"; fi'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: test-e2e
        name: e2e tests
        entry: bash -c 'if compgen -G "test/e2e/*.bats" > /dev/null; then bats test/e2e; else printf "%s\n" "no e2e tests yet"; fi'
        language: system
        pass_filenames: false
        stages: [manual]

  # --- Markdown: canonical format (dprint) + style gate (markdownlint) ---
  #
  # Universal overlay: every project carries docs/READMEs, so its markdown is
  # formatted and linted everywhere — the same model as the shared Nix overlay.
  # dprint owns canonical formatting; `markdown.textWrap: "never"` (in the sibling
  # ./dprint.markdown.json) unwraps every soft-wrapped paragraph to one continuous
  # physical line for small diffs and predictable LLM tokens. Explicit hard breaks
  # (two trailing spaces / trailing `\`) are preserved, fenced code blocks are left
  # unreflowed, and tables stay intact. markdownlint-cli2 gates style beyond what
  # dprint enforces and autofixes the one thing dprint can't — ordered-list
  # renumbering (MD029); rules live in the sibling ./.markdownlint-cli2.jsonc.
  #
  # A dedicated ./dprint.markdown.json + `--config` keeps this invocation
  # independent of the type's own JSON dprint.json, and the `dprint-markdown` id
  # never collides with the type's `dprint` hook.
  #
  # cog tailoring: shipped template payloads under skill-refs/templates/ are
  # authoritative and formatted by their own configs on deploy, so they are
  # excluded here exactly as they are from the json/check-json5 hooks above.
  #
  # External dependency: dprint must be on PATH (provided by the nix devShell),
  # the same model as the json/nix hooks. pre-commit only — git push may strip
  # PATH and the format is already applied by commit time.
  - repo: local
    hooks:
      - id: dprint-markdown
        name: dprint fmt (markdown)
        entry: dprint fmt --config dprint.markdown.json
        language: system
        files: '\.(md|markdown)$'
        exclude: '^(skill-refs/templates/|test/test_helper/)'
        pass_filenames: true
        stages: [pre-commit]

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools can tell
  # which file is meant, and the link silently rots when a file moves. Require an
  # explicit prefix: ./name, ../dir/name, or a multi-segment path dir/name.
  # Fragment-only (#...), root-absolute (/...), and URL links pass. pygrep is
  # built into pre-commit — no external dependency, no companion file.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        exclude: '^(skill-refs/templates/|test/test_helper/)'
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        exclude: '^(skill-refs/templates/|test/test_helper/)'
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # markdownlint-cli2 runs AFTER dprint. dprint owns all formatting; markdownlint
  # flags issues dprint can't normalize (heading hierarchy, link integrity) AND
  # autofixes ordered-list renumbering (MD029). The custom `relative-links` rule
  # (report-only) verifies an explicit relative target actually resolves on disk,
  # complementing the pygrep FORM guards above (form vs. existence). Configure via
  # the sibling ./.markdownlint-cli2.jsonc. Uses the node variant.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      # `language_version: system` pins this to the node already on PATH, and is
      # load-bearing here. `additional_dependencies` rules out `language: system`
      # (there would be no env to install the rule into), so this hook must use
      # pre-commit's node env — and pre-commit auto-selects `system` only when
      # node resolves OUTSIDE $HOME (lang_base.exe_exists rejects any executable
      # under the home dir or in a /shims/ dir). This repo's node comes from a
      # user nix profile under ~, so without this line pre-commit builds a
      # `node_env-default` by downloading a generic-glibc node — which cannot
      # exec on a Nix host and fails with ENOENT on the interpreter it just
      # selected. See skill-refs/pre-commit/hook-language-resolution.md.
      - id: markdownlint-cli2
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
        exclude: '^(skill-refs/templates/|test/test_helper/)'
