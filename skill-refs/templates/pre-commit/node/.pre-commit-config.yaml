# Node.js / TypeScript pre-commit configuration
# Tailor per-project (paths, additional_dependencies, exclude patterns).

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # Generic housekeeping hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      # JSON/JSONC formatting is owned by Biome (and Prettier) below, which parse
      # comments and trailing commas — no stdlib pretty-format-json here.
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch
        args: [--branch, staging, --branch, main, --branch, master]

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$|/package-lock\.json$'

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.8.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        # Markdown is excluded: editorconfig-checker can't parse it — it flags
        # fenced-code-block interiors and defaults to indent_size=4 even when
        # unset. Markdown/JS/TS formatting is owned by prettier (+ markdownlint);
        # align .editorconfig indent with prettier's tabWidth.
        exclude: '\.md$'

  # YAML style
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # Markdown style
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, MD033, MD041]

  # Pre-commit hook to check for spelling mistakes
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      # Report-only. The `args:` below are LOAD-BEARING: upstream's default
      # args are [--write-changes, --force-exclude], so a stanza that
      # overrides no args auto-fixes. typos' auto-fix silently rewrites
      # deliberate identifiers / error-kind strings and can break code. Fix
      # real typos by hand; allowlist false positives in _typos.toml.
      - id: typos
        # --force-exclude restated so `exclude:` still applies to filenames
        # pre-commit passes explicitly.
        args: [--force-exclude]

  # Biome – fast unified linter + formatter for JS/TS/JSON/JSONC
  # (use either Biome OR ESLint+Prettier per project — not both)
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.4.14
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.4.14"]

  # Prettier (rbubley fork — pre-commit/mirrors-prettier is archived)
  # Useful for formats Biome doesn't cover (Vue, Svelte, CSS, Markdown, YAML).
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        args: [--write]
        # additional_dependencies for plugins, e.g.:
        #   - prettier-plugin-tailwindcss
        #   - prettier-plugin-svelte

  # gitleaks – secret scanner
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        pass_filenames: false
        stages: [pre-commit]

  # --- Commit message: Conventional Commits (single SoT -> committed.toml) ---
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]
  # commitizen is intentionally NOT the commit-msg linter (committed is the SoT).
  # For version bumping / changelog only, add commitizen explicitly per-project.

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # Local node-based hooks (require deps installed in the project's package.json)
  - repo: local
    hooks:
      # TypeScript type checking
      # Requires typescript installed in the project (language: system)
      - id: tsc
        name: tsc --noEmit
        entry: npx --no-install tsc --noEmit
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

      # Unit tests with Vitest
      # Requires vitest installed in the project (language: system)
      - id: vitest
        name: vitest
        entry: npx --no-install vitest run
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
