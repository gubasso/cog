tiers:
  cheap:
    anti_signals:
      - any meaningful judgment
      - multi-step design
    effort: medium
    escalation: If a routine starts needing judgment, promote it to gpt-5.4 (low rung) or gpt-5.5.
    model: gpt-5.4-mini
    rationale: |-
      Use gpt-5.4-mini at medium as the chosen planning value for trivial work, preserving
      the prior routine-tier value across the rename. Verified 2026-06-24 against OpenAI model docs:
      gpt-5.4-mini supports reasoning effort none/low/medium/high/xhigh at the API (default none) and
      minimal/low/medium/high/xhigh via the Codex model_reasoning_effort key; pricing ($0.75 in / $4.50 out
      per MTok), 400K context, and 128K max output are confirmed.
    reference_docs:
      - docs/reference/models-reference-codex.md
    set_frontmatter: true
    signals:
      - thin orchestration over cog subcommands
      - no real reasoning
      - fast/cheap is the priority
    skills:
      - gc
    use_when: |-
      Bare execution of a simple routine where nearly all logic is deterministic and
      delegated to scripts or orchestrators; the model sequences calls and formats output.
  high:
    anti_signals:
      - a detailed plan already exists
      - purely mechanical or deterministic steps
    effort: (session default)
    escalation: Escalate effort only for stuck, unusually complex, or high-stakes work.
    model: (session default)
    rationale: |-
      The high rung rides the Codex session default: gpt-5.5 at medium effort. Round-1
      evidence treats this as the quality default and balanced recommendation.
    reference_docs:
      - docs/reference/models-reference-codex.md
    set_frontmatter: false
    signals:
      - unbounded search space
      - decisions not yet made
      - needs full session judgment
      - plan/ask/review-plan work
    skills:
      - ask
      - plan-writer
      - plan-writer-multi
      - executor-prex
      - review-plan-oneshot
    use_when: |-
      Open-ended reasoning: exploring a codebase, planning, asking or answering questions,
      reviewing a plan, and deciding an approach. The hard reasoning happens during the task.
  low:
    anti_signals:
      - novel design
      - open-ended exploration
    effort: medium
    escalation: Promote to gpt-5.5 (medium/high rungs) rather than running gpt-5.4 at high.
    model: gpt-5.4
    rationale: |-
      gpt-5.4 at medium drops the model (not just effort) for procedural work, capturing the
      cheaper model's per-token saving. gpt-5.4 at high is an anti-pattern because high effort erases that
      saving; reach for gpt-5.5 first when more reasoning is genuinely needed.
    reference_docs:
      - docs/reference/models-reference-codex.md
    set_frontmatter: true
    signals:
      - repeatable runbook
      - deterministic core delegated to cog
      - bounded judgment
      - verbatim queue dispatch
    skills:
      - pre-commit
      - test-review
      - review-findings
      - claudemd
      - osc-obs
      - suckless-patcher
      - ast-grep
    use_when: |-
      Executes a well-structured, detailed procedure where the hard decisions are already
      made and most mechanics are delegated to scripts or cog subcommands, but some judgment remains.
  medium:
    anti_signals:
      - novel open-ended design
      - from-scratch full review
    effort: low
    escalation: Raise to the high rung when implementation rediscovers requirements.
    model: gpt-5.5
    rationale: |-
      gpt-5.5 at low keeps the strong model while trimming effort for work whose hard
      reasoning was already spent upstream (a prepared plan, or a warm resumed re-review).
    reference_docs:
      - docs/reference/models-reference-codex.md
    set_frontmatter: true
    signals:
      - executes a prepared plan
      - resumed warm re-review
      - bounded implementation judgment
    skills:
      - executor-oneshot
      - executor-vetted
    use_when: |-
      Executor default and resumed review rounds: implement a prepared plan or re-review with
      retained context, where the hard design is already chewed but bounded judgment remains.
  xhigh:
    anti_signals:
      - reviewing an already-distilled plan
      - bounded procedural execution
    effort: high
    escalation: Do not raise routine work to this rung; it multiplies token burn.
    model: gpt-5.5
    rationale: |-
      gpt-5.5 at high is the escalation rung. Community-measured burn is about 3-5x medium,
      so it is reserved for genuinely hard or full from-scratch review work.
    reference_docs:
      - docs/reference/models-reference-codex.md
    set_frontmatter: false
    signals:
      - from-scratch full review
      - broad/multi-subsystem scope
      - security-critical or expensive to reverse
      - runs as an evaluation
    skills:
      - review-oneshot
    use_when: |-
      Hardest single-pass execution or full from-scratch review. The escalation rung above
      the session default.
