default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: destroyed-symlinks
      - id: detect-private-key
      # - id: no-commit-to-branch

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$'

  # --- JSON / JSONC formatter: dprint (comment-safe autofix) ---
  #
  # dprint's json plugin formats JSON and JSONC (comments + trailing commas),
  # which the stdlib-based pretty-format-json cannot. check-json5 above stays the
  # syntax gate; dprint owns formatting. Config in the sibling `./dprint.json`
  # (plugin version pinned there). `language: system`, so dprint is supplied by
  # the project's flake devShell (`pkgs.dprint`) — do not install it out-of-band;
  # the devShell is the single provider. pre-commit only — git push may strip
  # PATH, and formatting is already applied by commit time.
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt (json/jsonc)
        entry: dprint fmt
        language: system
        files: '\.(json|jsonc|json5)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.8.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        # Markdown is excluded: editorconfig-checker can't parse it — it flags
        # fenced-code-block interiors and the odd-width ordered-list
        # continuations CommonMark/dprint use (e.g. `1. ` -> 3 spaces), and
        # defaults to indent_size=4 even when unset. Markdown formatting is
        # owned by dprint + markdownlint-cli2 when those hooks are layered in.
        exclude: '\.md$'

  # --- Zig: format ---
  - repo: local
    hooks:
      - id: zig-fmt
        name: zig fmt
        entry: zig fmt
        language: system
        files: '\.(zig|zon)$'

  # --- Spell check ---
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      # Report-only. The `args:` below are LOAD-BEARING: upstream's default
      # args are [--write-changes, --force-exclude], so a stanza that
      # overrides no args auto-fixes. typos' auto-fix silently rewrites
      # deliberate identifiers / error-kind strings and can break code. Fix
      # real typos by hand; allowlist false positives in _typos.toml.
      - id: typos
        # --force-exclude restated so `exclude:` still applies to filenames
        # pre-commit passes explicitly.
        args: [--force-exclude]

  # --- Commit message: Conventional Commits (single SoT -> committed.toml) ---
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: zig-build-test
        name: zig build test
        entry: zig build test
        language: system
        pass_filenames: false
        stages: [pre-push]
