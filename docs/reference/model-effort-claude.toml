# Model/effort policy data - Claude.
# SoT for which model+effort a cog skill/task class uses.
# Evidence: docs/reference/models-reference-claude.md (Data collected: 2026-06-19).
schema_version = 1
provider = "claude"
forbidden_models = ["sonnet"]
sonnet_replacement = { model = "opus", effort = "low" }
session_default = { model = "opus", effort = "high", note = "exploration/planning skills set no override and ride this" }

[tiers.exploration]
model = "(session default)"
effort = "(session default)"
set_frontmatter = false
use_when = """Open-ended reasoning: exploring a codebase, planning, asking or answering questions,
reviewing design, and deciding an approach. The hard reasoning happens during the task."""
signals = ["unbounded search space", "decisions not yet made", "needs full session judgment", "plan/ask/review-design work"]
anti_signals = ["a detailed plan already exists", "purely mechanical or deterministic steps"]
examples = ["ask", "plan-writer", "plan-writer-multi", "executor-prex", "review-loop", "review-lean", "cog-skill-creator", "review-plan-lean"]
reference_docs = ["docs/reference/models-reference-claude.md"]
rationale = """Exploration and planning should ride the session default so genuinely open work keeps
the strongest default model and effort budget. Pinning frontmatter would cap that work."""
escalation = """A skill author may override per case when a task is genuinely harder than open
exploration, and the override must be justified in the skill or invocation context. Reviewing or
verifying an already-reasoned artifact (plan review, code review) rides the session default:
generator-verifier asymmetry makes critique cheaper than generation, tempered by the difficulty of
correctness judging, so opus+high is the right floor. Reserve effort=xhigh for reviews that span many
subsystems, are security-critical, are expensive to reverse, or run as evaluations."""

[tiers.procedural]
model = "opus"
effort = "low"
set_frontmatter = true
use_when = """Executes a well-structured, detailed procedure where the hard decisions are already
made and most mechanics are delegated to scripts or cog subcommands, but some judgment remains."""
signals = ["repeatable runbook", "deterministic core delegated to cog", "bounded judgment", "executes an existing detailed plan"]
anti_signals = ["novel design", "open-ended exploration"]
examples = ["pre-commit", "test-review", "review-findings", "claudemd", "osc-obs", "suckless-patcher", "ast-grep"]
reference_docs = ["docs/reference/models-reference-claude.md"]
rationale = """Opus at low effort is the canonical never-sonnet replacement tier: use the stronger
model at reduced effort instead of selecting Sonnet."""
escalation = """Raise to effort=medium for heavier detailed-plan execution when needed; never drop
to sonnet."""

[tiers.routine]
model = "haiku"
effort = "(none)"
set_frontmatter = true
use_when = """Bare execution of a simple routine where nearly all logic is deterministic and
delegated to scripts or orchestrators; the model sequences calls and formats output."""
signals = ["thin orchestration over cog subcommands", "no real reasoning", "fast/cheap is the priority"]
anti_signals = ["any meaningful judgment", "multi-step design"]
examples = ["gc"]
reference_docs = ["docs/reference/models-reference-claude.md"]
rationale = """Haiku is fastest and cheapest for simple routines. Haiku 4.5 returns an error if an
effort parameter is sent, so skill frontmatter must omit effort for Haiku."""
escalation = """If the routine starts needing judgment, promote it to the procedural tier
(model=opus, effort=low) rather than adding an effort field to Haiku."""
