# Model/effort policy data - Codex.
# SoT for codex-session / cog codex-runner model+effort.
# Evidence: docs/reference/models-reference-codex.md (Data collected: 2026-06-24).
schema_version = 1
provider = "codex"
session_default = { model = "gpt-5.5", effort = "medium" }
subscription_auth_models = ["gpt-5.5", "gpt-5.4", "gpt-5.4-mini"]
api_only_model_suffix = "-codex"
api_only_model_rule = """Models ending in -codex are API-only and must never be pinned for
subscription-auth Codex. cog codex-runner and codex-session pin only gpt-5.5, gpt-5.4, or
gpt-5.4-mini under subscription auth."""
# gpt-5.3-codex-spark is a ChatGPT Pro-only, text-only research preview (near-instant iteration).
# Not pinned here: it is a preview, Pro-tier-gated, and outside the current working set.
# Evidence: https://developers.openai.com/codex/models (verified 2026-06-24).

# supported_efforts: the reasoning-effort enumeration for the Codex CLI `model_reasoning_effort`
# config key that `cog codex-runner` sets (the layer cog actually drives). Evidence:
# https://developers.openai.com/codex/config-reference -> `model_reasoning_effort` =
# minimal | low | medium | high | xhigh (xhigh is model-dependent). Verified 2026-06-24.
#
# CROSS-SURFACE NUANCE (do not "fix" the lowest token without reading this): the OpenAI *API*
# `reasoning_effort` parameter and the per-model pages use `none` (NOT `minimal`) for the lowest
# tier, and `none` is the API default for gpt-5.4 and gpt-5.4-mini (gpt-5.5 defaults to medium).
# The Codex `model_reasoning_effort` key does NOT accept `none`, so cog's lowest reachable Codex
# tier is `minimal`; `none` and `minimal` denote the same ~0.1x lowest tier across the two
# surfaces. The separate `plan_mode_reasoning_effort` key accepts the superset
# `none | minimal | low | medium | high | xhigh`. cog's runtime validator
# (lib/functions/fn_codex.sh `__cog_codex_map_effort`) correctly accepts the
# `model_reasoning_effort` set and is the SoT for what cog can emit.
[supported_efforts]
"gpt-5.5" = ["minimal", "low", "medium", "high", "xhigh"]
"gpt-5.4" = ["minimal", "low", "medium", "high", "xhigh"]
"gpt-5.4-mini" = ["minimal", "low", "medium", "high", "xhigh"]

# Canonical named tier ladder (xhigh/high/medium/low/cheap), mirroring the Claude ladder in
# model-effort-claude.toml. Codex cells: xhigh=gpt-5.5@high, high=gpt-5.5@medium (session default),
# medium=gpt-5.5@low, low=gpt-5.4@medium, cheap=gpt-5.4-mini@medium. These supersede the former
# exploration/procedural/routine names. Codex skills carry no SKILL.md frontmatter; the tier is
# selected at runtime through cog codex-runner. The per-tier `skills = [...]` lists mirror the Claude
# registry for reference only; the `model-effort-tier` lint reads the Claude file. See ADR-0041.

[tiers.xhigh]
model = "gpt-5.5"
effort = "high"
set_frontmatter = false
use_when = """Hardest single-pass execution or full from-scratch review. The escalation rung above
the session default."""
signals = ["from-scratch full review", "broad/multi-subsystem scope", "security-critical or expensive to reverse", "runs as an evaluation"]
anti_signals = ["reviewing an already-distilled plan", "bounded procedural execution"]
skills = ["review-oneshot"]
reference_docs = ["docs/reference/models-reference-codex.md"]
rationale = """gpt-5.5 at high is the escalation rung. Community-measured burn is about 3-5x medium,
so it is reserved for genuinely hard or full from-scratch review work."""
escalation = """Do not raise routine work to this rung; it multiplies token burn."""

[tiers.high]
model = "(session default)"
effort = "(session default)"
set_frontmatter = false
use_when = """Open-ended reasoning: exploring a codebase, planning, asking or answering questions,
reviewing a plan, and deciding an approach. The hard reasoning happens during the task."""
signals = ["unbounded search space", "decisions not yet made", "needs full session judgment", "plan/ask/review-plan work"]
anti_signals = ["a detailed plan already exists", "purely mechanical or deterministic steps"]
skills = ["ask", "plan-writer", "plan-writer-multi", "executor-prex", "review-plan-oneshot"]
reference_docs = ["docs/reference/models-reference-codex.md"]
rationale = """The high rung rides the Codex session default: gpt-5.5 at medium effort. Round-1
evidence treats this as the quality default and balanced recommendation."""
escalation = """Escalate effort only for stuck, unusually complex, or high-stakes work."""

[tiers.medium]
model = "gpt-5.5"
effort = "low"
set_frontmatter = true
use_when = """Executor default and resumed review rounds: implement a prepared plan or re-review with
retained context, where the hard design is already chewed but bounded judgment remains."""
signals = ["executes a prepared plan", "resumed warm re-review", "bounded implementation judgment"]
anti_signals = ["novel open-ended design", "from-scratch full review"]
skills = ["executor-oneshot", "executor-vetted"]
reference_docs = ["docs/reference/models-reference-codex.md"]
rationale = """gpt-5.5 at low keeps the strong model while trimming effort for work whose hard
reasoning was already spent upstream (a prepared plan, or a warm resumed re-review)."""
escalation = """Raise to the high rung when implementation rediscovers requirements."""

[tiers.low]
model = "gpt-5.4"
effort = "medium"
set_frontmatter = true
use_when = """Executes a well-structured, detailed procedure where the hard decisions are already
made and most mechanics are delegated to scripts or cog subcommands, but some judgment remains."""
signals = ["repeatable runbook", "deterministic core delegated to cog", "bounded judgment", "verbatim queue dispatch"]
anti_signals = ["novel design", "open-ended exploration"]
skills = ["pre-commit", "test-review", "review-findings", "claudemd", "osc-obs", "suckless-patcher", "ast-grep"]
reference_docs = ["docs/reference/models-reference-codex.md"]
rationale = """gpt-5.4 at medium drops the model (not just effort) for procedural work, capturing the
cheaper model's per-token saving. gpt-5.4 at high is an anti-pattern because high effort erases that
saving; reach for gpt-5.5 first when more reasoning is genuinely needed."""
escalation = """Promote to gpt-5.5 (medium/high rungs) rather than running gpt-5.4 at high."""

[tiers.cheap]
model = "gpt-5.4-mini"
effort = "medium"
set_frontmatter = true
use_when = """Bare execution of a simple routine where nearly all logic is deterministic and
delegated to scripts or orchestrators; the model sequences calls and formats output."""
signals = ["thin orchestration over cog subcommands", "no real reasoning", "fast/cheap is the priority"]
anti_signals = ["any meaningful judgment", "multi-step design"]
skills = ["gc"]
reference_docs = ["docs/reference/models-reference-codex.md"]
rationale = """Use gpt-5.4-mini at medium as the chosen planning value for trivial work, preserving
the prior routine-tier value across the rename. Verified 2026-06-24 against OpenAI model docs:
gpt-5.4-mini supports reasoning effort none/low/medium/high/xhigh at the API (default none) and
minimal/low/medium/high/xhigh via the Codex model_reasoning_effort key; pricing ($0.75 in / $4.50 out
per MTok), 400K context, and 128K max output are confirmed."""
escalation = """If a routine starts needing judgment, promote it to gpt-5.4 (low rung) or gpt-5.5."""
