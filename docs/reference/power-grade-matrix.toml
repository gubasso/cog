# Power Grade matrix v1.
# Data collected: 2026-06-25
# Revalidate by: 2026-09-25, or sooner on model, pricing, benchmark, effort, or policy changes.
#
# Committed schema:
# - schema_version: integer schema marker.
# - [scale]: single numeric grade scale; all profile grades must be inside min..max.
# - [validation]: severity contract. Missing required executable profile fields are fatal;
#   evidence_status = "needs_verification" is non-fatal when the profile is informational or the
#   missing public data is explicitly cited in caveats.
# - [compound]: single source of truth for compound-pass math. Shell helpers read these values.
# - [[profiles]]: one profile per executable model/effort cell, plus informational verification rows.
#   Required keys: id, slug, label, provider, model, effort, grade, executable,
#   policy_selectable, evidence_status, confidence, source_refs, benchmark_source_ids, description,
#   use_where, caveats. `source_refs` are human doc anchors; `benchmark_source_ids` are allowlist IDs.
# - [[named_profiles]]: policy pairings that keep model-effort policy and this matrix aligned.
schema_version = 1
data_collected = "2026-06-25"
revalidate_by = "2026-09-25"

[scale]
min = 1
max = 10
description = "Power Grade is a difficulty ceiling for a single model/effort profile. Higher numbers mean the profile can handle harder, more ambiguous, or higher-blast-radius work."
grade_rule = "Assign grades from the sourced model benchmark, effort-support, pricing, and qualitative Power Grade input rows. Do not invent missing benchmark numbers; use evidence_status and confidence for gaps."

[validation]
needs_verification_is_fatal = false
informational_profile_is_fatal = false
unsupported_efforts_as_profiles = false
required_profile_keys = [
  "id",
  "slug",
  "label",
  "provider",
  "model",
  "effort",
  "grade",
  "executable",
  "policy_selectable",
  "evidence_status",
  "confidence",
  "source_refs",
  "benchmark_source_ids",
  "description",
  "use_where",
  "caveats",
]

[compound]
formula = "capped_max_plus_artifact_gain"
description = "compound_grade = min(scale.max, max(pass grades) + sum(artifact_gain for pass 2..n))"
# Partial-result contract: compound_grade is authoritative only when ok == true. When ok == false
# (an unknown or non-executable pass appears in `errors`), base_grade/artifact_gain/compound_grade
# are computed from the surviving executable passes only and must be treated as partial; read `ok`
# and `errors` before consuming the number.
result_is_authoritative_only_when_ok = true
cap_to_scale_max = true
first_pass_gain = 0
subsequent_pass_artifact_gain = 1
unknown_artifact_gain = 0

