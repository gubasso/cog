command_surface_patterns:
  - pattern: '(^|[^[:alnum:]_-])src/'
    reason: Source file layout signatures do not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])lib/'
    reason: Source module layout signatures do not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])tests?/'
    reason: Source test layout signatures do not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])spec/'
    reason: Source test layout signatures do not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])[A-Za-z0-9_-]+\.(rs|py|js|ts|go|java|rb|php|cs|cpp|c|h|hpp)([^[:alnum:]_-]|$)'
    reason: Source implementation filenames do not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])(GET|POST|PUT|PATCH|DELETE) /[A-Za-z0-9_./{}:-]+'
    reason: Copied route tables do not belong in the tech-agnostic capability spec.
test_structure_patterns:
  - pattern: 'describe[(]'
    reason: Copied test scaffolding does not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])it[(]'
    reason: Copied test scaffolding does not belong in the tech-agnostic capability spec.
  - pattern: '#\[test\]'
    reason: Copied test scaffolding does not belong in the tech-agnostic capability spec.
  - pattern: 'assert_eq!'
    reason: Copied test assertions do not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])def test_'
    reason: Copied test function structure does not belong in the tech-agnostic capability spec.
  - pattern: '(^|[^[:alnum:]_-])(fixtures?|conftest)\.(py|js|ts|rb)([^[:alnum:]_-]|$)'
    reason: Source test fixture filenames do not belong in the tech-agnostic capability spec.
