# Canonical instruction paragraph injected by the `ask` skill's `-r/--real-world`
# research flag. Rendered at runtime by `cog ask-flag render --flag <key>`; both the
# Claude and Codex `ask` twins inject the emitted text into the delegated prompt so
# the always-loaded skill body stays lean and the wording never drifts between twins.
# This file is the single registry: valid flag keys are its `ask_flags` keys. The
# `-w/--web-search` directive is shared with the reviewer skills and lives in
# skill-refs/research/primary-source-verification.md, not here.
ask_flags:
  real-world: >
    Perform deep web research into real-world reference implementations and the
    projects widely regarded as best-in-class at solving similar problems. Surface
    the best-established patterns, practices, architectures, and coding designs for
    this kind of problem, name the exemplar projects you find, and explain why each
    is exemplary (proven at scale, idiomatic for the stack, well-documented, widely
    adopted). Cite the projects and sources relied on.
