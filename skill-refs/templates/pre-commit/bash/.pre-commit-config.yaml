# Bash‑centric pre‑commit configuration

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # Generic housekeeping hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch
        args: [--branch, staging, --branch, main, --branch, master]

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$'

  # --- JSON / JSONC formatter: dprint (comment-safe autofix) ---
  #
  # dprint's json plugin formats JSON and JSONC (comments + trailing commas),
  # which the stdlib-based pretty-format-json cannot. check-json5 above stays the
  # syntax gate; dprint owns formatting. Config in the sibling `./dprint.json`
  # (plugin version pinned there). External dependency: dprint must be on PATH
  # (`cargo install dprint` or your package manager). pre-commit only — git push
  # may strip PATH, and formatting is already applied by commit time.
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt (json/jsonc)
        entry: dprint fmt
        language: system
        files: '\.(json|jsonc|json5)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.7.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        # Markdown is excluded: editorconfig-checker can't parse it — it flags
        # fenced-code-block interiors and defaults to indent_size=4 even when
        # unset. Align indent rules with shfmt (-i 2) in .editorconfig.
        exclude: '\.md$'

  # ShellCheck – static analysis
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # shfmt – code formatter
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci"]   # 2‑space indent, keep control‑indented

  # bashate – style checker
  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        args: ["-i", "E003,E006", "-e", "E005"]  # allow 2-space indent; error on tabs
        exclude: ^tests/(.*\.bats|test_helper\.bash)$

  # Pre-commit hook to check for spelling mistakes
  - repo: https://github.com/crate-ci/typos
    rev: v1.45.1
    hooks:
      # Report-only (no --write-changes): typos auto-fix silently rewrites
      # deliberate identifiers / error-kind strings and can break code. Fix
      # real typos by hand; allowlist false positives in _typos.toml.
      - id: typos

  # gitleaks – secret scanner
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        pass_filenames: false      # let gitleaks handle its own scanning scope
        stages: [pre-commit]

  # shellharden – auto-quote variables and command substitutions
  - repo: local
    hooks:
      - id: shellharden
        name: shellharden
        language: system
        entry: shellharden --replace
        types: [shell]

  # --- Commit message: Conventional Commits (single SoT -> committed.toml) ---
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]
  # commitizen is intentionally NOT the commit-msg linter (committed is the SoT).
  # For version bumping / changelog only, add commitizen explicitly per-project.

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # bats – Bash Automated Testing System
  - repo: local
    hooks:
      - id: bats-tests
        name: bats tests
        language: system
        entry: bats tests
        pass_filenames: false
        always_run: true
