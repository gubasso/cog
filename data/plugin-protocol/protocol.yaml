# The plugin protocol constants. One row per value cog promises to a plugin, so
# a change here is a change to a published contract rather than to a literal
# buried in a function.
#
# Membership is the permission: a state a plugin can be in is a row that exists,
# not a boolean on a row that does not.
plugin-protocol:
  version: 1
  reserved_subcommand: "cog-plugin-metadata"
  required_metadata_fields: ["protocol", "name", "version", "summary"]
  optional_metadata_fields: ["requires_cog"]
  exported_environment:
    - "COG_PLUGIN_PROTOCOL"
    - "COG_HOST_VERSION"
    - "COG_PLUGIN_NAME"
    - "COG_EXECUTABLE"
  probe_timeout_seconds: 2
  probe_output_cap_bytes: 65536
  name_pattern: "^[a-z][a-z0-9_-]*$"
  executable_prefix: "cog-"
