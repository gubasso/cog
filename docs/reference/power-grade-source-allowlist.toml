# Trusted-sources allowlist for Power Grade benchmark and capability data.
# Single source of truth for which sources may back a power-grade-matrix.toml cell, and at what trust
# tier. A cell's `evidence_status` may move off `needs_verification` only when a number is stated on a
# Tier 1 source (the model vendor's own page, a benchmark owner's leaderboard, or a vendor mirror that
# restates first-party numbers in readable text), or a Tier 2 source with a recorded caveat. Tier 3
# sources never clear a cell; they are discovery aids only.
#
# Committed schema:
# - schema_version: integer schema marker.
# - data_collected / revalidate_by: ISO dates; revalidate on the maintenance-tracking cadence.
# - [policy]: the tiering rule, in one place.
# - [[sources]]: one block per source. Required keys: id, name, url, tier, owner, data_types,
#   trusted_for, not_trusted_for, methodology_transparency, reproducible_auditable, update_cadence,
#   clears_needs_verification, notes, last_checked.
# - tier 1 = canonical or first-party restatement (vendor docs for model facts; benchmark owner
#   leaderboards for scores; vendor mirrors that restate first-party numbers in readable text).
#   tier 2 = secondary (independent aggregator or reputable secondary press that traces to upstream
#   methodology or a confirmed source; clears with a caveat). tier 3 = weak/excluded (no methodology,
#   copies upstream, link-rot, or marketing); never clears a cell.
schema_version = 1
data_collected = "2026-06-25"
revalidate_by = "2026-09-25"

[policy]
clears_rule = "tier <= 2"
tier1_clears = true
tier2_clears_with_caveat = true
tier3_clears = false
description = "Vendor pages are tier 1 for model facts (pricing, context, cutoff, effort support); benchmark owners are tier 1 for their own scores; vendor mirrors are tier 1 when they restate first-party benchmark numbers in readable text. Reputable secondary press may be tier 2 with a recorded caveat. A source's tier can differ by data type, captured in trusted_for/not_trusted_for. Tier 3 entries are recorded so a forbidden source is never silently re-introduced."

