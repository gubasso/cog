tiers:
  cheap:
    anti_signals:
      - any meaningful judgment
      - multi-step design
    effort: (none)
    escalation: |-
      If the routine starts needing judgment, promote it to the low tier
      (model=opus, effort=low) rather than adding an effort field to Haiku.
    model: haiku
    rationale: |-
      Haiku is fastest and cheapest for simple routines. Haiku 4.5 returns an error if an
      effort parameter is sent, so skill frontmatter must omit effort for Haiku.
    reference_docs:
      - docs/reference/models-reference-claude.md
    set_frontmatter: true
    signals:
      - thin orchestration over cog subcommands
      - no real reasoning
      - fast/cheap is the priority
    skills: []
    use_when: |-
      Bare execution of a simple routine where nearly all logic is deterministic and
      delegated to scripts or orchestrators; the model sequences calls and formats output.
  high:
    anti_signals:
      - a detailed plan already exists
      - purely mechanical or deterministic steps
    effort: (session default)
    escalation: |-
      A skill author may override per case when a task is genuinely harder; the override
      must be justified in the skill or invocation context. A reasoning executor (judging, re-evaluating,
      directing, fixing) may ride this tier instead of the executor default.
    model: (session default)
    rationale: |-
      Open work rides the session default (opus+high) so genuinely open reasoning keeps the
      strongest default budget. Reviewing an already-reasoned plan rides this same floor: generator-verifier
      asymmetry makes critique cheaper than generation, tempered by the difficulty of correctness judging.
    reference_docs:
      - docs/reference/models-reference-claude.md
    set_frontmatter: false
    signals:
      - unbounded search space
      - decisions not yet made
      - needs full session judgment
      - plan/ask/review-plan work
    skills:
      - ask
      - plan-oneshot
      - plan-multi
      - plan-builder-to-queue
      - plan-builder-to-queue-vetted-multi
      - plan-vetted
      - executor-greenfield-from-spec
      - executor-prex
      - review-plan-oneshot
      - review-plan-multi
      - review-oneshot
      - review-loop
      - cog-skill-creator
    use_when: |-
      Open-ended reasoning: exploring a codebase, planning, asking or answering questions,
      reviewing a plan, and deciding an approach. The hard reasoning happens during the task.
  low:
    anti_signals:
      - novel design
      - open-ended exploration
    effort: low
    escalation: |-
      Raise to effort=medium for heavier detailed-plan execution when needed; never drop
      to sonnet.
    model: opus
    rationale: |-
      Opus at low effort is the canonical never-sonnet replacement tier: use the stronger
      model at reduced effort instead of selecting Sonnet.
    reference_docs:
      - docs/reference/models-reference-claude.md
    set_frontmatter: true
    signals:
      - repeatable runbook
      - deterministic core delegated to cog
      - bounded judgment
      - verbatim queue dispatch
    skills:
      - bootstrap
      - bootstrap-lint
      - bootstrap-nix
      - bootstrap-repo
      - bootstrap-ci
      - bootstrap-taskrunner
      - bootstrap-governance
      - bootstrap-rust
      - bootstrap-installer
      - bootstrap-knowledge-base
      - test-review
      - review-findings
      - review-queue-rounds
      - claudemd
      - osc-obs
      - suckless-patcher
      - ast-grep
      - assess-input
      - jira-ticket-creator
      - gc
      - gc-hook-fix
      - gc-repo
      - runner-all
      - runner-plan
    use_when: |-
      Executes a well-structured, detailed procedure where the hard decisions are already
      made and most mechanics are delegated to scripts or cog subcommands, but some judgment remains.
  medium:
    anti_signals:
      - novel open-ended design
      - pure verbatim dispatch
    effort: medium
    escalation: Raise a reasoning executor to high when it judges/re-evaluates/directs/fixes.
    model: opus
    rationale: |-
      Implementing a prepared plan needs real but bounded reasoning: opus+medium sits above
      the never-Sonnet procedural floor and below open planning effort.
    reference_docs:
      - docs/reference/models-reference-claude.md
    set_frontmatter: true
    signals:
      - executes a prepared plan
      - implements to completion
      - bounded implementation judgment
      - may spawn subagents
    skills:
      - executor-oneshot
      - executor-vetted
    use_when: |-
      Executor default: implement a prepared plan with bounded judgment, where the hard
      design is already chewed but reality-friction decisions remain during implementation.
  xhigh:
    anti_signals:
      - reviewing an already-distilled plan
      - bounded procedural execution
    effort: xhigh
    escalation: Reserve effort=max for the rare task beyond xhigh; never default to it.
    model: opus
    rationale: |-
      Fresh-context full review erodes the generator-verifier asymmetry discount: the
      reviewer must rebuild the whole context before it can judge, so the floor rises to opus+xhigh.
    reference_docs:
      - docs/reference/models-reference-claude.md
    set_frontmatter: true
    signals:
      - from-scratch full review
      - broad/multi-subsystem scope
      - security-critical or expensive to reverse
      - runs as an evaluation
    skills: []
    use_when: |-
      Hardest single-pass execution or full from-scratch review that must reconstruct an
      entire codebase, plan, and diff before judging. The escalation rung above the session default.
