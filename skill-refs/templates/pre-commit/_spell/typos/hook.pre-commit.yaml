  # --- Spelling (report-only) ---
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      # Report-only. The `args:` below are LOAD-BEARING: upstream's default
      # args are [--write-changes, --force-exclude], so a stanza that
      # overrides no args auto-fixes. typos' auto-fix silently rewrites
      # deliberate identifiers / error-kind strings and can break code. Fix
      # real typos by hand; allowlist false positives in _typos.toml.
      - id: typos
        # --force-exclude restated so `exclude:` still applies to filenames
        # pre-commit passes explicitly.
        args: [--force-exclude]
