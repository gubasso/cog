# The workflow engine registry. Membership is the permission: an engine that
# cannot be run is a row that does not exist, not a row with a false flag.
# Each record carries exactly four fields, and the id is derived as
# <provider>-<model>-<effort>.
#
# ADR-0027 accepted an eleven-engine seed; the seed is a floor, not a ceiling.
# Rows are added as providers ship subscription-available models, and the five
# registry invariants gate every row. Provider effort ladders are fixed by
# docs/reference/workflow-contract.md and are not extended here.
#
# Two rows the ladders would otherwise imply are deliberately absent:
#   * claude-fable-5-none — Fable 5 runs thinking unconditionally and rejects a
#     disabled-thinking request, so a "none" row could never be dispatched.
#   * claude-haiku-4.5 above "none" — the seed pins Haiku at the bottom rung.
workflow-engines:
  # --- claude ---------------------------------------------------------------
  - id: "claude-haiku-4.5-none"
    provider: "claude"
    model: "haiku-4.5"
    effort: "none"
